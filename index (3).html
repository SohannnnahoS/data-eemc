<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Étude EEMC</title>
<style>
:root{--lado:min(70vh,88vw,640px)}
*{box-sizing:border-box;border-radius:0}
body{margin:0;background:#fff;color:#000;font:16px/1.5 Helvetica,"Helvetica Neue",Arial,sans-serif;padding:32px 24px}
.zone{display:flex;gap:40px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.col-carre{display:grid;grid-template-columns:auto var(--lado) auto;grid-template-rows:auto var(--lado) auto;gap:8px;align-items:center;justify-items:center;font-size:15px}
.carre{grid-column:2;grid-row:2;width:var(--lado);height:var(--lado);position:relative;border:2px solid #4A4A4A;
background:linear-gradient(#E1EAF9 0 0) 0 0/50% 50% no-repeat,linear-gradient(#F0E1F9 0 0) 100% 0/50% 50% no-repeat,
linear-gradient(#F9F0E1 0 0) 100% 100%/50% 50% no-repeat,linear-gradient(#EAF9E1 0 0) 0 100%/50% 50% no-repeat}
.carre::before{content:"";position:absolute;inset:0;opacity:.07;background-image:linear-gradient(#000 1px,transparent 1px),linear-gradient(90deg,#000 1px,transparent 1px);background-size:5% 5%}
.cx,.cy{position:absolute;background:#4A4A4A}
.cx{left:0;right:0;top:50%;height:2px;margin-top:-1px}.cy{top:0;bottom:0;left:50%;width:2px;margin-left:-1px}
.pt{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px}
.panneau{background:#fff;border:1px solid #000;padding:20px 24px;width:min(480px,92vw)}
.ligne{display:flex;gap:10px;margin-bottom:10px;align-items:flex-end}
.ligne label{flex:1;font-size:14px}
input[type=text]{width:100%;padding:8px;border:1px solid #000;background:#fff;color:#000;font:inherit;margin-top:3px}
input[type=text]:focus{outline:none;border-width:2px;padding:7px}
input[type=color]{width:44px;height:38px;border:1px solid #000;padding:2px;background:#fff;cursor:pointer}
input[type=checkbox]{accent-color:#000}
.btn{background:#fff;border:1px solid #000;padding:0 18px;height:40px;cursor:pointer;font:inherit;color:#000}
.btn:hover{background:#000;color:#fff}
.liste{margin-top:18px;border-top:1px solid #000;padding-top:10px;max-height:340px;overflow-y:auto}
.item{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:14px}
.item input[type=color]{width:32px;height:30px}
.item input[type=text]{margin:0;padding:4px 6px;height:30px;font-size:14px}
.item input[type=text]:focus{padding:3px 5px}
.item .nom{flex:1;min-width:60px}.item .mini{width:58px}
.item .sup{border:0;background:none;color:#000;cursor:pointer;font-size:18px;padding:0 4px}
/* sélecteur visuel de forme */
.sf{display:inline-block}
.sfb{width:38px;height:38px;border:1px solid #000;background:#fff;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.item .sfb{width:30px;height:30px}
.ico{display:block;width:18px;height:18px}
.sfp{display:none;position:fixed;z-index:10;grid-template-columns:repeat(3,34px);background:#fff;border:1px solid #000}
.sfo{width:34px;height:34px;border:0;background:#fff;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sfo:hover{outline:2px solid #000;outline-offset:-2px}
</style>
</head>
<body>
<div class="zone">
  <div class="col-carre">
    <div style="grid-column:2;grid-row:1">Très énergique</div>
    <div style="grid-column:1;grid-row:2">Négatif</div>
    <div class="carre" id="carre"><div class="cx"></div><div class="cy"></div></div>
    <div style="grid-column:3;grid-row:2">Positif</div>
    <div style="grid-column:2;grid-row:3">Peu énergique</div>
  </div>
  <div class="panneau">
    <div class="ligne">
      <label>Valence<input type="text" id="val" inputmode="decimal"></label>
      <label>Énergie<input type="text" id="ene" inputmode="decimal"></label>
    </div>
    <div class="ligne">
      <label>Nom<input type="text" id="nom"></label>
      <span id="forme-place"></span>
      <input type="color" id="coul" value="#E03030" title="Couleur">
    </div>
    <button class="btn" id="ajouter">Ajouter</button>
    <div class="liste" id="liste"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let points = [], prochainId = 1;

const FORMES = {
  "Rond": '<circle cx="10" cy="10" r="8"/>',
  "Triangle": '<polygon points="10,2.6 18.5,17.4 1.5,17.4"/>',
  "Carré": '<rect x="2" y="2" width="16" height="16"/>',
  "Étoile": '<polygon points="10,1 12.12,7.09 18.56,7.22 13.42,11.11 15.29,17.28 10,13.6 4.71,17.28 6.58,11.11 1.44,7.22 7.88,7.09"/>',
  "Cœur": '<path d="M10 17.5 C2 11 1.5 6 4.5 3.8 C7 2 9.3 3.6 10 5.5 C10.7 3.6 13 2 15.5 3.8 C18.5 6 18 11 10 17.5 Z"/>',
  "Losange": '<polygon points="10,1.5 18.5,10 10,18.5 1.5,10"/>',
  "Croix": '<path d="M3.5 3.5 L16.5 16.5 M16.5 3.5 L3.5 16.5"/>',
  "Pentagone": '<polygon points="10,1 18.56,7.22 15.29,17.28 4.71,17.28 1.44,7.22"/>',
  "Plus": '<path d="M10 2 V18 M2 10 H18"/>'
};
const LIGNES = ["Croix", "Plus"];
function svgForme(f, c){
  const l = LIGNES.includes(f);
  return '<svg viewBox="0 0 20 20" width="100%" height="100%" style="display:block;overflow:visible"><g fill="' +
    (l ? "none" : c) + '" stroke="' + c + '" stroke-width="' + (l ? 3.5 : 1.5) + '" stroke-linejoin="round">' + FORMES[f] + '</g></svg>';
}

/* Sélecteur visuel : un bouton qui montre la forme, et une grille de formes au clic */
function fermer(){ document.querySelectorAll(".sfp").forEach(p => p.style.display = "none"); }
document.addEventListener("click", fermer);
window.addEventListener("scroll", fermer, true);
function selecteurForme(valeur, onchange){
  const w = document.createElement("div"); w.className = "sf"; w.valeur = valeur;
  const b = document.createElement("button"); b.type = "button"; b.className = "sfb";
  const pop = document.createElement("div"); pop.className = "sfp";
  const maj = () => { b.innerHTML = '<span class="ico">' + svgForme(w.valeur, "#000") + '</span>'; };
  Object.keys(FORMES).forEach(f => {
    const o = document.createElement("button"); o.type = "button"; o.className = "sfo"; o.title = f;
    o.innerHTML = '<span class="ico">' + svgForme(f, "#000") + '</span>';
    o.onclick = e => { e.stopPropagation(); w.valeur = f; maj(); pop.style.display = "none"; if (onchange) onchange(f); };
    pop.appendChild(o);
  });
  b.onclick = e => {
    e.stopPropagation();
    const etaitOuvert = pop.style.display === "grid"; fermer();
    if (!etaitOuvert) { const r = b.getBoundingClientRect(); pop.style.left = r.left + "px"; pop.style.top = (r.bottom + 2) + "px"; pop.style.display = "grid"; }
  };
  maj(); w.append(b, pop); return w;
}
const selecteurAjout = selecteurForme("Rond");
$("forme-place").appendChild(selecteurAjout);

function nombre(txt){ return parseFloat(String(txt).trim().replace(",", ".")); }
const valide = n => !isNaN(n) && n >= -1 && n <= 1;

/* Dessin des points sur le carré */
function dessiner(){
  document.querySelectorAll(".pt").forEach(p => p.remove());
  points.forEach(p => {
    if (!p.visible) return;
    const d = document.createElement("div");
    d.className = "pt"; d.innerHTML = svgForme(p.forme, p.couleur);
    d.style.left = (p.v + 1) * 50 + "%"; d.style.top = (1 - p.e) * 50 + "%";
    d.title = (p.nom || "Point " + p.id) + " (" + p.v + " ; " + p.e + ")";
    $("carre").appendChild(d);
  });
}

/* Liste modifiable : chaque point peut être changé (nom, coordonnées, forme, couleur) */
function refaireListe(){
  const l = $("liste"); l.innerHTML = "";
  points.forEach(p => {
    const it = document.createElement("div"); it.className = "item";
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = p.visible; cb.title = "Afficher / masquer";
    cb.onchange = () => { p.visible = cb.checked; dessiner(); };
    const c = document.createElement("input"); c.type = "color"; c.value = p.couleur;
    c.oninput = () => { p.couleur = c.value; dessiner(); };
    const sf = selecteurForme(p.forme, f => { p.forme = f; dessiner(); });
    const nom = document.createElement("input"); nom.type = "text"; nom.className = "nom"; nom.value = p.nom;
    nom.onchange = () => { p.nom = nom.value.trim(); dessiner(); };
    const vi = document.createElement("input"); vi.type = "text"; vi.className = "mini"; vi.value = p.v; vi.title = "Valence";
    vi.onchange = () => { const n = nombre(vi.value); if (valide(n)) { p.v = n; dessiner(); } vi.value = p.v; };
    const ei = document.createElement("input"); ei.type = "text"; ei.className = "mini"; ei.value = p.e; ei.title = "Énergie";
    ei.onchange = () => { const n = nombre(ei.value); if (valide(n)) { p.e = n; dessiner(); } ei.value = p.e; };
    const x = document.createElement("button"); x.className = "sup"; x.textContent = "×"; x.title = "Supprimer";
    x.onclick = () => { points = points.filter(q => q !== p); dessiner(); refaireListe(); };
    it.append(cb, c, sf, nom, vi, ei, x); l.appendChild(it);
  });
}

function ajouter(){
  const v = nombre($("val").value), e = nombre($("ene").value);
  if (!valide(v) || !valide(e)) return;
  points.push({ id: prochainId++, v, e, nom: $("nom").value.trim(), couleur: $("coul").value,
    forme: selecteurAjout.valeur, visible: true });
  $("val").value = ""; $("ene").value = ""; $("nom").value = ""; $("val").focus();
  dessiner(); refaireListe();
}
$("ajouter").onclick = ajouter;
["val", "ene", "nom"].forEach(id => $(id).addEventListener("keydown", e => { if (e.key === "Enter") ajouter(); }));
</script>
</body>
</html>
