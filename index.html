<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Étude EEMC</title>
<style>
:root{--lado:min(70vh,88vw,640px)}
*{box-sizing:border-box;border-radius:0}
body{margin:0;background:#fff;color:#000;font:16px/1.5 Helvetica,"Helvetica Neue",Arial,sans-serif;padding:32px 24px}
.zone{display:flex;gap:40px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.col-carre{display:grid;grid-template-columns:auto var(--lado) auto;grid-template-rows:auto var(--lado) auto;gap:8px;align-items:center;justify-items:center;font-size:15px}
.carre{grid-column:2;grid-row:2;width:var(--lado);height:var(--lado);position:relative;border:2px solid #4A4A4A;
background:linear-gradient(#E1EAF9 0 0) 0 0/50% 50% no-repeat,linear-gradient(#F0E1F9 0 0) 100% 0/50% 50% no-repeat,
linear-gradient(#F9F0E1 0 0) 100% 100%/50% 50% no-repeat,linear-gradient(#EAF9E1 0 0) 0 100%/50% 50% no-repeat}
.carre::before{content:"";position:absolute;inset:0;opacity:.07;background-image:linear-gradient(#000 1px,transparent 1px),linear-gradient(90deg,#000 1px,transparent 1px);background-size:5% 5%}
.cx,.cy{position:absolute;background:#4A4A4A}
.cx{left:0;right:0;top:50%;height:2px;margin-top:-1px}.cy{top:0;bottom:0;left:50%;width:2px;margin-left:-1px}
.pt{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50% !important;border:1.5px solid}
.panneau{background:#fff;border:1px solid #000;padding:20px 24px;width:min(440px,92vw)}
.ligne{display:flex;gap:10px;margin-bottom:10px;align-items:flex-end}
.ligne label{flex:1;font-size:14px}
input[type=text]{width:100%;padding:8px;border:1px solid #000;background:#fff;color:#000;font:inherit;margin-top:3px}
input[type=text]:focus{outline:none;border-width:2px;padding:7px}
input[type=color]{width:44px;height:38px;border:1px solid #000;padding:2px;background:#fff;cursor:pointer}
input[type=checkbox]{accent-color:#000}
.btn{background:#fff;border:1px solid #000;padding:0 18px;height:40px;cursor:pointer;font:inherit;color:#000}
.btn:hover{background:#000;color:#fff}
.liste{margin-top:18px;border-top:1px solid #000;padding-top:10px;max-height:320px;overflow-y:auto}
.item{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px}
.item .nom{flex:1}
.item button{border:0;background:none;color:#000;cursor:pointer;font-size:18px}
</style>
</head>
<body>
<div class="zone">
  <div class="col-carre">
    <div style="grid-column:2;grid-row:1">Très énergique</div>
    <div style="grid-column:1;grid-row:2">Négatif</div>
    <div class="carre" id="carre"><div class="cx"></div><div class="cy"></div></div>
    <div style="grid-column:3;grid-row:2">Positif</div>
    <div style="grid-column:2;grid-row:3">Peu énergique</div>
  </div>
  <div class="panneau">
    <div class="ligne">
      <label>Valence<input type="text" id="val" inputmode="decimal"></label>
      <label>Énergie<input type="text" id="ene" inputmode="decimal"></label>
    </div>
    <div class="ligne">
      <label>Nom<input type="text" id="nom"></label>
      <input type="color" id="coul" value="#E03030" title="Couleur">
    </div>
    <button class="btn" id="ajouter">Ajouter</button>
    <div class="liste" id="liste"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let points = [], prochainId = 1;

function nombre(txt){ return parseFloat(String(txt).trim().replace(",", ".")); }

function afficher(){
  document.querySelectorAll(".pt").forEach(p => p.remove());
  points.forEach(p => {
    if (!p.visible) return;
    const d = document.createElement("div");
    d.className = "pt"; d.style.background = p.couleur; d.style.borderColor = p.couleur;
    d.style.left = (p.v + 1) * 50 + "%"; d.style.top = (1 - p.e) * 50 + "%";
    d.title = (p.nom || "Point " + p.id) + " (" + p.v + " ; " + p.e + ")";
    $("carre").appendChild(d);
  });
  const l = $("liste"); l.innerHTML = "";
  points.forEach(p => {
    const it = document.createElement("div"); it.className = "item";
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = p.visible; cb.title = "Afficher / masquer";
    cb.onchange = () => { p.visible = cb.checked; afficher(); };
    const c = document.createElement("input"); c.type = "color"; c.value = p.couleur; c.style.cssText = "width:34px;height:30px";
    c.oninput = () => { p.couleur = c.value; afficher(); };
    const nom = document.createElement("span"); nom.className = "nom";
    nom.textContent = p.nom || "Point " + p.id;
    const co = document.createElement("span"); co.textContent = p.v + " ; " + p.e;
    const x = document.createElement("button"); x.textContent = "×"; x.title = "Supprimer";
    x.onclick = () => { points = points.filter(q => q !== p); afficher(); };
    it.append(cb, c, nom, co, x); l.appendChild(it);
  });
}

function ajouter(){
  const v = nombre($("val").value), e = nombre($("ene").value);
  if (isNaN(v) || isNaN(e) || v < -1 || v > 1 || e < -1 || e > 1) return;
  points.push({ id: prochainId++, v, e, nom: $("nom").value.trim(), couleur: $("coul").value, visible: true });
  $("val").value = ""; $("ene").value = ""; $("nom").value = ""; $("val").focus();
  afficher();
}
$("ajouter").onclick = ajouter;
["val", "ene", "nom"].forEach(id => $(id).addEventListener("keydown", e => { if (e.key === "Enter") ajouter(); }));
afficher();
</script>
</body>
</html>
