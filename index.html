<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Étude EEMC · Visualisation</title>
<style>
:root{--fond:#F7F7F7;--panneau:#fff;--bord:#DADADA;--texte:#2B2B2B;--doux:#6B6B6B;--cadre:#4A4A4A;
--bouton:#D6D6D6;--bouton2:#C6C6C6;--piste:#B4B4B4;--lado:min(70vh,88vw,640px)}
*{box-sizing:border-box}
body{margin:0;background:var(--fond);color:var(--texte);font:16px/1.5 Helvetica,"Helvetica Neue",Arial,sans-serif;padding:24px}
h1{text-align:center;font-size:28px;margin:0 0 4px}
.sous{text-align:center;color:var(--doux);margin-bottom:24px}
.zone{display:flex;gap:40px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.col-carre{display:grid;grid-template-columns:auto var(--lado) auto;grid-template-rows:auto var(--lado) auto;gap:8px;align-items:center;justify-items:center;color:var(--doux);font-size:15px}
.carre{grid-column:2;grid-row:2;width:var(--lado);height:var(--lado);position:relative;border:2px solid var(--cadre);
background:linear-gradient(#E1EAF9 0 0) 0 0/50% 50% no-repeat,linear-gradient(#F0E1F9 0 0) 100% 0/50% 50% no-repeat,
linear-gradient(#F9F0E1 0 0) 100% 100%/50% 50% no-repeat,linear-gradient(#EAF9E1 0 0) 0 100%/50% 50% no-repeat}
.carre::before{content:"";position:absolute;inset:0;opacity:.07;background-image:linear-gradient(#000 1px,transparent 1px),linear-gradient(90deg,#000 1px,transparent 1px);background-size:5% 5%}
.cx,.cy{position:absolute;background:var(--cadre)}
.cx{left:0;right:0;top:50%;height:2px;margin-top:-1px}.cy{top:0;bottom:0;left:50%;width:2px;margin-left:-1px}
.pt{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:1.5px solid rgba(0,0,0,.35)}
.panneau{background:var(--panneau);border:1px solid var(--bord);border-radius:16px;padding:22px 26px;width:min(440px,92vw)}
.panneau h3{margin:0 0 12px;font-size:18px}
.ligne{display:flex;gap:10px;margin-bottom:10px;align-items:center}
.ligne label{flex:1;font-size:14px;color:var(--doux)}
input[type=text]{width:100%;padding:8px;border:1.5px solid var(--piste);border-radius:8px;font:inherit;margin-top:3px}
input[type=color]{width:44px;height:38px;border:1px solid var(--piste);border-radius:8px;padding:2px;background:#fff;cursor:pointer}
.btn{background:var(--bouton);border:1px solid var(--piste);border-radius:10px;padding:0 16px;height:40px;cursor:pointer;font:inherit;color:#000}
.btn:hover{background:var(--bouton2)}
.erreur{color:#B03030;font-size:14px;min-height:20px}
.liste{margin-top:18px;border-top:1px solid #E4E4E4;padding-top:10px;max-height:320px;overflow-y:auto}
.item{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px}
.item .nom{flex:1}.item .coord{color:var(--doux);font-size:13px}
.item button{border:0;background:none;color:#B03030;cursor:pointer;font-size:18px}
.vide{color:var(--doux);font-size:14px}
</style>
</head>
<body>
<h1>Étude EEMC · Visualisation</h1>
<div class="sous">Ajoutez des points (valence et énergie de -1 à 1) pour les visualiser sur le carré.</div>
<div class="zone">
  <div class="col-carre">
    <div style="grid-column:2;grid-row:1">Très énergique</div>
    <div style="grid-column:1;grid-row:2">Négatif</div>
    <div class="carre" id="carre"><div class="cx"></div><div class="cy"></div></div>
    <div style="grid-column:3;grid-row:2">Positif</div>
    <div style="grid-column:2;grid-row:3">Peu énergique</div>
  </div>
  <div class="panneau">
    <h3>Ajouter un point</h3>
    <div class="ligne">
      <label>Valence (-1 à 1)<input type="text" id="val" inputmode="decimal" placeholder="0.5"></label>
      <label>Énergie (-1 à 1)<input type="text" id="ene" inputmode="decimal" placeholder="-0.3"></label>
    </div>
    <div class="ligne">
      <label>Nom (facultatif)<input type="text" id="nom" placeholder="ex : piano"></label>
      <input type="color" id="coul" value="#E03030" title="Couleur">
    </div>
    <div class="erreur" id="err"></div>
    <button class="btn" id="ajouter">Ajouter</button>
    <div class="liste" id="liste"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let points = [], prochainId = 1;

function nombre(txt){ return parseFloat(String(txt).trim().replace(",", ".")); }

function afficher(){
  // points sur le carré
  document.querySelectorAll(".pt").forEach(p => p.remove());
  points.forEach(p => {
    if (!p.visible) return;
    const d = document.createElement("div");
    d.className = "pt"; d.style.background = p.couleur;
    d.style.left = (p.v + 1) * 50 + "%"; d.style.top = (1 - p.e) * 50 + "%";
    d.title = (p.nom || "Point " + p.id) + " (" + p.v + " ; " + p.e + ")";
    $("carre").appendChild(d);
  });
  // liste
  const l = $("liste"); l.innerHTML = "";
  if (!points.length) { l.innerHTML = '<div class="vide">Aucun point pour le moment.</div>'; return; }
  points.forEach(p => {
    const it = document.createElement("div"); it.className = "item";
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = p.visible; cb.title = "Afficher / masquer";
    cb.onchange = () => { p.visible = cb.checked; afficher(); };
    const c = document.createElement("input"); c.type = "color"; c.value = p.couleur; c.style.cssText = "width:34px;height:30px";
    c.oninput = () => { p.couleur = c.value; afficher(); };
    const nom = document.createElement("span"); nom.className = "nom";
    nom.textContent = p.nom || "Point " + p.id;
    const co = document.createElement("span"); co.className = "coord"; co.textContent = p.v + " ; " + p.e;
    const x = document.createElement("button"); x.textContent = "×"; x.title = "Supprimer";
    x.onclick = () => { points = points.filter(q => q !== p); afficher(); };
    it.append(cb, c, nom, co, x); l.appendChild(it);
  });
}

function ajouter(){
  const v = nombre($("val").value), e = nombre($("ene").value);
  if (isNaN(v) || isNaN(e) || v < -1 || v > 1 || e < -1 || e > 1) {
    $("err").textContent = "Entrez deux nombres entre -1 et 1 (ex : 0.5 et -0.3)."; return;
  }
  $("err").textContent = "";
  points.push({ id: prochainId++, v, e, nom: $("nom").value.trim(), couleur: $("coul").value, visible: true });
  $("val").value = ""; $("ene").value = ""; $("nom").value = ""; $("val").focus();
  afficher();
}
$("ajouter").onclick = ajouter;
["val", "ene", "nom"].forEach(id => $(id).addEventListener("keydown", e => { if (e.key === "Enter") ajouter(); }));
afficher();
</script>
</body>
</html>
